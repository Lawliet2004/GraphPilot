server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 26m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /api { return 404; }
  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
