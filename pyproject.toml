[project]
name = "graphpilot"
version = "0.1.0"
description = "Evidence-aware code intelligence with FalkorDB"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1,<26", "httpx>=0.28,<1",
  "falkordb>=1.1.3,<2", "python-multipart>=0.0.20,<1", "pathspec>=0.12,<1"
]
[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "falkordblite>=0.10,<1",
    "aiosmtpd>=1.4.6,<2",
]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
