name: GraphPilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - run: sudo apt-get update && sudo apt-get install -y gitleaks
      - run: uv sync --frozen
      - run: uv run python -m scripts.verify_repository
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: mkdir -p .data/ci
      - run: uv export --frozen --all-groups --no-emit-project --format requirements.txt --output-file .data/ci/requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip --strict -r .data/ci/requirements.txt --format json --output .data/ci/python-audit.json
      - name: Audit frontend lock including development dependencies
        if: ${{ !cancelled() }}
        run: mkdir -p .data/ci && npm --prefix app audit --package-lock-only --json > .data/ci/frontend-npm-audit.json
      - name: Audit browser-tooling lock
        if: ${{ !cancelled() }}
        run: mkdir -p .data/ci && npm audit --package-lock-only --json > .data/ci/e2e-npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audits
          path: |
            .data/ci/python-audit.json
            .data/ci/frontend-npm-audit.json
            .data/ci/e2e-npm-audit.json
          if-no-files-found: error
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - run: uv sync --frozen
      - run: mkdir -p .data/ci
      - run: uv run python -m scripts.verify_compose --output .data/ci/container.json
      - name: Audit built and service images
        run: uv run python -m scripts.audit_container_images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: |
            .data/ci/container.json
            .data/ci/image-audit/summary.json
            .data/ci/image-audit/run-*/*.json
          if-no-files-found: error
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: graphpilot
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: graphpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U graphpilot" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      GP_TEST_DATABASE_URL: postgresql+psycopg://graphpilot:isolated-ci-password@127.0.0.1:5432/graphpilot
      GP_FALKOR_PORT: 56379
      GP_TEST_FALKOR_PORT: 56379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - run: uv sync --frozen
      - run: uv run ruff check api tests scripts migrations
      - run: |
          uv run python scripts/run-lite.py > /tmp/falkor.log 2>&1 &
          for attempt in $(seq 1 30); do
            uv run python -c "import redis; redis.Redis(port=56379).ping()" && break || sleep 1
          done
          uv run python -c "import redis; redis.Redis(port=56379).ping()"
          uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json}
      - run: npm --prefix app ci
      - run: npm --prefix app run build
      - run: npm --prefix app audit --omit=dev
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: graphpilot
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: graphpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U graphpilot" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      GP_DATABASE_URL: postgresql+psycopg://graphpilot:isolated-ci-password@127.0.0.1:5432/graphpilot
      GP_ENVIRONMENT: test
      GP_FALKOR_PORT: 56379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: package-lock.json}
      - run: uv sync --frozen
      - run: npm ci && npm --prefix app ci
      - run: npx playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - name: Run real service journeys
        run: |
          uv run python scripts/run-lite.py > /tmp/falkor.log 2>&1 &
          uv run uvicorn api.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/api.log 2>&1 &
          uv run python -m api.worker > /tmp/worker.log 2>&1 &
          npm --prefix app run dev > /tmp/vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health/ready
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report
            test-results
            .impeccable/review
          retention-days: 7
